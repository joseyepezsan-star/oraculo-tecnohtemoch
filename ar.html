<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Consulta AR — Tecnohtemoch</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="predicciones.js"></script>

<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:Georgia,"Times New Roman",serif;
}

/* Mantener visible el video de cámara y el canvas AR transparente */
video{
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  z-index:0!important;
}
a-scene{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  z-index:1!important;
  background:transparent!important;
}
.a-canvas{
  background:transparent!important;
  background-color:transparent!important;
}

#hud{
  position:fixed;inset:0;z-index:9999;pointer-events:none;
}
#topbar{
  position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));
  background:rgba(10,7,5,.86);border:1px solid #8a5b2c;
  color:#f0dfbf;padding:10px 12px;text-align:center;
}
#status{font-weight:700}
#hint{font-size:.82rem;color:#c8a984;margin-top:3px}

#startPanel{
  pointer-events:auto;position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:24px;
}
#startCard{
  max-width:560px;background:#100b08;border:1px solid #8a5b2c;
  color:#f0dfbf;padding:24px;text-align:center;
}
button{
  border:1px solid #bf8843;background:#2b1710;color:#f5e6c9;
  padding:14px 18px;font:700 16px Georgia,serif;cursor:pointer;
  width:100%;margin-top:12px;
}
#technical{
  font:12px/1.45 Consolas,monospace;color:#d1b991;background:#090705;
  padding:10px;margin-top:14px;text-align:left;white-space:pre-wrap;
}

/* Carta HTML superpuesta: más compatible que una textura canvas sobre WebGL */
#predictionOverlay{
  position:absolute;
  left:50%;
  top:56%;
  transform:translate(-50%,-50%) scale(.92);
  width:min(86vw,520px);
  max-height:62vh;
  overflow:auto;
  background:linear-gradient(#e5d2a8,#d3b77f 55%,#b9925d);
  color:#23140c;
  border:4px double #5a351d;
  box-shadow:0 12px 45px rgba(0,0,0,.65);
  padding:22px 20px;
  opacity:0;
  visibility:hidden;
  pointer-events:auto;
  transition:opacity .35s ease, transform .35s ease;
}
#predictionOverlay.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,-50%) scale(1);
}
#predictionOverlay h2{
  margin:0 0 16px;text-align:center;font-size:1.1rem;letter-spacing:.06em;
}
#predictionOverlay p{line-height:1.38;margin:12px 0}
#predictionOverlay .giro{font-style:italic;color:#5b321d}
#predictionOverlay .consejo{
  font-weight:700;border-top:1px solid rgba(50,28,14,.35);padding-top:12px;
}
#predictionOverlay .firma{
  text-align:center;font-size:.78rem;color:#73401f;margin-top:16px;
}
#closePrediction{
  pointer-events:auto;
  width:auto;
  display:block;
  margin:16px auto 0;
  padding:9px 14px;
  border:1px solid #5a351d;
  background:rgba(255,255,255,.12);
  color:#23140c;
  font-weight:700;
  cursor:pointer;
}

#fallback{
  pointer-events:auto;position:absolute;left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);text-decoration:none;color:#f3dfbd;
  background:rgba(25,13,9,.9);border:1px solid #9d6b34;
  padding:10px 14px;white-space:nowrap;
}
</style>
</head>
<body>

<div id="hud">
  <div id="topbar">
    <div id="status">Preparando el Oráculo…</div>
    <div id="hint">Espera a que MindAR esté listo.</div>
  </div>

  <div id="startPanel">
    <div id="startCard">
      <h2>Consulta con cámara</h2>
      <p>Activa la cámara y apunta al mural completo de Tecnohtemoch.</p>
      <button id="startBtn" disabled>ACTIVAR CÁMARA</button>
      <div id="technical">Esperando carga…</div>
    </div>
  </div>

  <section id="predictionOverlay" aria-live="polite">
    <h2 id="predTitle"></h2>
    <p id="predSerio"></p>
    <p id="predGiro" class="giro"></p>
    <p id="predConsejo" class="consejo"></p>
    <div class="firma">— Tecnohtemoch Ruseveltzin Neztacotoyotl —</div>
    <button id="closePrediction">Cerrar augurio</button>
  </section>

  <a id="fallback" href="fallback.html">El oráculo no coopera → usar modo simple</a>
</div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: false; alpha: true; precision: mediump;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!--
    Ya no se dibuja ninguna carta, halo ni brillo dentro del canvas WebGL.
    MindAR se usa sólo para reconocer el mural de forma robusta.
  -->
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const scene = document.querySelector("#scene");
  const target = document.querySelector("#target");

  const status = document.querySelector("#status");
  const hint = document.querySelector("#hint");
  const startPanel = document.querySelector("#startPanel");
  const startBtn = document.querySelector("#startBtn");
  const technical = document.querySelector("#technical");

  const overlay = document.querySelector("#predictionOverlay");
  const predTitle = document.querySelector("#predTitle");
  const predSerio = document.querySelector("#predSerio");
  const predGiro = document.querySelector("#predGiro");
  const predConsejo = document.querySelector("#predConsejo");
  const closePrediction = document.querySelector("#closePrediction");

  let arSystem = null;
  let lastShownAt = 0;
  let targetVisible = false;

  const log = (m) => {
    technical.textContent += "\n" + m;
    console.log("[ORACULO]", m);
  };

  technical.textContent = "";
  log("A-Frame: " + (window.AFRAME ? AFRAME.version : "NO CARGÓ"));
  log("MindAR component: " + (!!(window.AFRAME && AFRAME.components && AFRAME.components["mindar-image"])));
  log("Modo de carta: HTML superpuesto (compatibilidad alta)");

  window.addEventListener("error", e => log("ERROR JS: " + e.message));
  window.addEventListener("unhandledrejection", e => {
    const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    log("PROMESA RECHAZADA: " + reason);
  });

  scene.addEventListener("loaded", () => {
    arSystem = scene.systems["mindar-image-system"];
    log("Escena cargada.");
    log("MindAR system: " + (!!arSystem));

    if (arSystem) {
      status.textContent = "Oráculo listo";
      hint.textContent = "Pulsa ACTIVAR CÁMARA.";
      startBtn.disabled = false;
    } else {
      status.textContent = "MindAR no se registró";
      hint.textContent = "Revisa el diagnóstico.";
    }
  });

  scene.addEventListener("arReady", () => {
    log("EVENTO: arReady");
    status.textContent = "Busca a Tecnohtemoch";
    hint.textContent = "Apunta la cámara hacia la pintura completa.";
    startPanel.style.display = "none";
  });

  scene.addEventListener("arError", () => {
    log("EVENTO: arError");
    status.textContent = "No se pudo iniciar la cámara";
    hint.textContent = "Revisa permisos o diagnóstico.";
    startBtn.disabled = false;
  });

  async function startAR() {
    startBtn.disabled = true;
    status.textContent = "Solicitando cámara…";
    hint.textContent = "Acepta el permiso del navegador.";
    log("Inicio solicitado.");

    try {
      arSystem = scene.systems["mindar-image-system"];
      if (!arSystem) throw new Error("MindAR no está disponible.");
      await arSystem.start();
      log("start() completado.");
    } catch (err) {
      log("FALLO start(): " + (err && err.message ? err.message : String(err)));
      status.textContent = "No se pudo iniciar";
      hint.textContent = "Revisa el diagnóstico.";
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener("click", startAR);

  function showPrediction() {
    const p = window.elegirPrediccion();

    predTitle.textContent = p.titulo;
    predSerio.textContent = p.serio;
    predGiro.textContent = p.gracioso;
    predConsejo.textContent = p.consejo;

    overlay.classList.add("show");
    status.textContent = "El oráculo ha hablado";
    hint.textContent = "Puedes leer el augurio sin dejar de ver la cámara.";

    lastShownAt = Date.now();
  }

  function hidePrediction() {
    overlay.classList.remove("show");
    if (targetVisible) {
      status.textContent = "Tecnohtemoch sigue presente";
      hint.textContent = "Aparta la cámara y vuelve a apuntar para otra consulta.";
    } else {
      status.textContent = "Busca a Tecnohtemoch";
      hint.textContent = "Apunta la cámara hacia la pintura completa.";
    }
  }

  closePrediction.addEventListener("click", hidePrediction);

  target.addEventListener("targetFound", () => {
    targetVisible = true;
    log("TARGET FOUND");

    // Evita dobles activaciones muy rápidas en algunos teléfonos.
    if (Date.now() - lastShownAt < 1500) return;

    status.textContent = "Tecnohtemoch te ha visto…";
    hint.textContent = "Consultando las antiguas runas.";

    // Pequeña pausa dramática, pero sin efectos WebGL.
    setTimeout(() => {
      if (targetVisible) showPrediction();
    }, 650);
  });

  target.addEventListener("targetLost", () => {
    targetVisible = false;
    log("TARGET LOST");

    // La carta permanece visible para que el usuario pueda terminar de leerla.
    if (!overlay.classList.contains("show")) {
      status.textContent = "Tecnohtemoch desapareció";
      hint.textContent = "Vuelve a apuntar a la pintura completa.";
    }
  });
});
</script>
</body>
</html>
