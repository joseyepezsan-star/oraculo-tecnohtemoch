<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba WebGL</title>
<style>
body{background:#111;color:#eee;font-family:system-ui;padding:28px}main{max-width:760px;margin:auto}
pre{background:#000;border:1px solid #444;padding:16px;white-space:pre-wrap}
.ok{color:#7ee787}.bad{color:#ff7b72}
</style>
</head>
<body>
<main>
<h1>Prueba WebGL</h1>
<pre id="out">Probando…</pre>
</main>
<script>
const out=document.querySelector("#out");
function test(type){
  const c=document.createElement("canvas");
  try{
    const gl=c.getContext(type);
    if(!gl) return type+": NO DISPONIBLE";
    const dbg=gl.getExtension("WEBGL_debug_renderer_info");
    let renderer="desconocido";
    if(dbg) renderer=gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    return type+": DISPONIBLE\nRenderer: "+renderer;
  }catch(e){return type+": ERROR — "+e.message;}
}
out.textContent=test("webgl2")+"\n\n"+test("webgl")+"\n\nNavegador:\n"+navigator.userAgent;
</script>
</body>
</html>
